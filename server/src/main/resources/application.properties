spring.application.name=server

spring.datasource.url=jdbc:mysql://localhost:3306/pet_medical_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# Redis：登录态 Token 与在线用户统计
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3s

# RabbitMQ：订单超时自动取消
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# 消费失败不重回队列，避免异常消息无限循环
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# Qwen DashScope 配置
ai.api-key=sk
ai.model=qwen-plus
# 前端药品详情真实地址前缀（现在改为自动搜索模式）
ai.drug-detail-base-url=http://localhost:5173/mall?keyword=
